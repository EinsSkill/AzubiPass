<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AzubiPass · Vorschau Aufgabenbausteine</title>
<style>
:root{
  --gruen:#1B4332; --gruen-hell:#2D6A4F; --gold:#C9A227;
  --creme:#F5F5F0; --papier:#FFFFFF; --linie:#DEDCD2;
  --text:#1C1C1A; --leise:#6B6B63;
  --richtig:#2D6A4F; --falsch:#9B2C2C;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--creme); color:var(--text);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-size:17px; line-height:1.6;
}
.kopfleiste{
  background:var(--gruen); color:var(--creme);
  padding:18px 24px; display:flex; flex-wrap:wrap; gap:16px;
  align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:10;
}
.marke{font-size:19px; letter-spacing:.14em; text-transform:uppercase}
.marke b{color:var(--gold); font-weight:600}
.steuerung{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
button{
  font-family:inherit; font-size:15px; padding:8px 16px;
  border:1px solid var(--gold); background:transparent; color:var(--creme);
  border-radius:2px; cursor:pointer;
}
button:hover{background:rgba(201,162,39,.18)}
button.an{background:var(--gold); color:var(--gruen); font-weight:600}
button.haupt{background:var(--gold); color:var(--gruen); font-weight:600; border-color:var(--gold)}
main{max-width:820px; margin:0 auto; padding:32px 20px 80px}
.hinweis{
  border-left:3px solid var(--gold); padding:10px 16px; margin-bottom:28px;
  color:var(--leise); font-size:15px; background:var(--papier);
}
.aufgabe{
  background:var(--papier); border:1px solid var(--linie);
  padding:26px 28px; margin-bottom:26px;
}
.a-kopf{
  display:flex; justify-content:space-between; align-items:baseline;
  gap:14px; border-bottom:1px solid var(--linie);
  padding-bottom:10px; margin-bottom:18px;
}
.a-nr{font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--gruen)}
.a-punkte{font-size:14px; color:var(--leise); white-space:nowrap}
.operator{font-weight:600}
p{margin:0 0 14px}
.gold{color:#8A6D10; font-weight:600}
.verweis{border-bottom:1px dotted var(--gold); cursor:help}
details.anlage{
  border:1px solid var(--linie); margin:16px 0; background:var(--creme);
}
details.anlage summary{
  padding:11px 16px; cursor:pointer; font-size:15px;
  letter-spacing:.04em; color:var(--gruen); font-weight:600;
}
details.anlage[open] summary{border-bottom:1px solid var(--linie)}
.anlage-inhalt{padding:6px 16px 14px}
table{border-collapse:collapse; width:100%; font-size:15px; margin:8px 0}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--linie)}
th{font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--leise)}
td.zahl{text-align:right; font-family:"SF Mono",Menlo,Consolas,monospace}
.frage{margin:16px 0 12px}
label.opt{
  display:flex; gap:11px; align-items:flex-start; padding:11px 14px;
  border:1px solid var(--linie); margin-bottom:8px; cursor:pointer;
}
label.opt:hover{border-color:var(--gruen-hell)}
label.opt input{margin-top:6px}
.echo{font-size:14px; padding:8px 14px 12px 39px; color:var(--leise)}
.opt.richtig{border-color:var(--richtig); background:rgba(45,106,79,.06)}
.opt.falsch{border-color:var(--falsch); background:rgba(155,44,44,.05)}
.zuordnung{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:14px 0}
@media(max-width:620px){.zuordnung{grid-template-columns:1fr}}
.stapel .el{
  border:1px solid var(--linie); padding:10px 13px; margin-bottom:8px;
  cursor:pointer; font-size:15px; background:var(--creme);
}
.stapel .el.gewaehlt{border-color:var(--gold); background:rgba(201,162,39,.14)}
.stapel .el.gesetzt{opacity:.35; cursor:default}
.ziel{
  border:1px dashed var(--linie); padding:10px 13px; margin-bottom:8px;
  min-height:52px; cursor:pointer;
}
.ziel-name{font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--leise)}
.ziel .drin{font-size:15px; margin-top:5px}
.ziel .drin span{display:block; padding:2px 0}
.feldzeile{display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap}
.feldzeile label{min-width:210px; font-size:15px}
input[type=text],input[type=number],textarea{
  font-family:inherit; font-size:16px; padding:8px 11px;
  border:1px solid var(--linie); background:var(--creme); color:var(--text);
  border-radius:0;
}
input[type=number]{width:170px; text-align:right; font-family:"SF Mono",Menlo,monospace}
textarea{width:100%; line-height:1.55}
.feld-punkte{font-size:13px; color:var(--leise)}
.ok{color:var(--richtig); font-weight:600}
.nok{color:var(--falsch); font-weight:600}
.loesungsblock{
  margin-top:18px; border-top:1px solid var(--linie); padding-top:16px;
}
.loesungsblock h4{
  margin:0 0 8px; font-size:14px; text-transform:uppercase;
  letter-spacing:.12em; color:var(--gruen);
}
.raster label{display:flex; gap:10px; align-items:flex-start; margin-bottom:7px; font-size:15px}
.raster .p{margin-left:auto; color:var(--leise); font-size:14px; white-space:nowrap}
.erklaerung{font-size:15px; color:var(--leise); margin-top:14px; border-left:2px solid var(--gold); padding-left:13px}
.fusszeile{
  position:sticky; bottom:0; background:var(--gruen); color:var(--creme);
  padding:14px 24px; display:flex; justify-content:space-between;
  align-items:center; gap:14px; flex-wrap:wrap;
}
.ergebnis{font-size:18px}
.ergebnis b{color:var(--gold)}
.verborgen{display:none}
</style>
</head>
<body>

<div class="kopfleiste">
  <div class="marke">Azubi<b>Pass</b> · Vorschau</div>
  <div class="steuerung">
    <button id="btn-ueben" class="an">Freies Üben</button>
    <button id="btn-klausur">Klausur</button>
    <button id="btn-wuerfeln">Neu würfeln</button>
  </div>
</div>

<main>
  <div class="hinweis" id="modushinweis"></div>
  <div id="aufgaben"></div>
</main>

<div class="fusszeile">
  <div class="ergebnis" id="ergebnis">Noch nicht abgegeben</div>
  <button class="haupt" id="btn-abgeben">Abgeben und auswerten</button>
</div>

<script>
/* ---------- Die Aufgabendatei (im echten Betrieb wird sie geladen) ---------- */
const DATEI = {
 "lernfeld":"buchfuehrung","kapitel":"k1","verweise_im_klausurmodus":"ausblenden",
 "bausteine":[
 {"id":"buchfuehrung-k1-01","operator":"Kreuzen Sie an","anforderungsbereich":1,"punkte":3,"dauer_min":3,
  "anzeige":[{"block":"text","inhalt":"Sandra Koslowski erklärt Ihnen, warum die MAKEL Studio GmbH Bücher führen muss."}],
  "eingabe":[{"block":"auswahl","frage":"Welche Aussage zur Buchführungspflicht der MAKEL Studio GmbH trifft zu?","optionen":[
    {"text":"Die Pflicht ergibt sich aus {{par:hgb-238|§ 238 HGB}}, weil ein Handelsgewerbe betrieben wird — auf Umsatz oder Gewinn kommt es nicht an.","richtig":true,"echo":"Richtig. Für Kaufleute greift § 238 HGB ohne jede Schwelle. Die Schwellenwerte der AO werden erst dort wichtig, wo kein Kaufmann vorliegt."},
    {"text":"Die Pflicht entsteht erst, weil der Umsatz über 600.000 € liegt.","richtig":false,"echo":"Diese Schwelle stammt aus § 141 AO und gilt für Gewerbetreibende, die keine Kaufleute sind. Eine GmbH ist Formkaufmann — für sie greift § 238 HGB von Anfang an."},
    {"text":"Die Pflicht entsteht erst, weil der Gewinn über 60.000 € liegt.","richtig":false,"echo":"Auch das ist eine Schwelle aus § 141 AO. Sie wird für die MAKEL Studio GmbH nie geprüft, weil die handelsrechtliche Pflicht vorrangig ist."},
    {"text":"Als GmbH besteht keine handelsrechtliche, sondern nur eine steuerliche Buchführungspflicht.","richtig":false,"echo":"Umgekehrt: Die handelsrechtliche Pflicht kommt zuerst, die steuerliche folgt ihr über § 140 AO. Man nennt das die abgeleitete (derivative) Pflicht."}]}],
  "bewertung":{"art":"automatisch","punkte_gesamt":3},
  "erklaerung":"Reihenfolge merken: erst HGB prüfen, dann AO. Wer Kaufmann ist, braucht die AO-Schwellen gar nicht mehr anzusehen."},

 {"id":"buchfuehrung-k1-02","operator":"Ordnen Sie zu","anforderungsbereich":2,"punkte":4,"dauer_min":3,
  "anzeige":[{"block":"text","inhalt":"Jonas Weidner bereitet im Lager am Gewerbehof den Jahresabschluss vor."}],
  "eingabe":[{"block":"zuordnung","lead":"Ordnen Sie jede Tätigkeit dem richtigen Begriff zu.","ziele":["Inventur","Inventar","Bilanz"],"elemente":[
    {"text":"Die Hoodies im Lager werden Stück für Stück durchgezählt.","loesung":"Inventur"},
    {"text":"Eine Liste führt 340 Positionen mit Menge und Einzelwert auf.","loesung":"Inventar"},
    {"text":"Aktiva und Passiva stehen sich gegenüber und sind gleich hoch.","loesung":"Bilanz"},
    {"text":"Pflichtbestandteil des Jahresabschlusses nach {{par:hgb-242|§ 242 HGB}}.","loesung":"Bilanz"}]}],
  "bewertung":{"art":"automatisch","punkte_je_treffer":1},
  "erklaerung":"Der Dreisatz: Inventur ist der Vorgang, Inventar das Verzeichnis, Bilanz die Verdichtung."},

 {"id":"buchfuehrung-k1-03","operator":"Berechnen Sie","anforderungsbereich":2,"punkte":5,"dauer_min":5,
  "variablen":{"maschinen":{"von":240000,"bis":340000,"schritt":10000},"fuhrpark":{"von":60000,"bis":120000,"schritt":10000},
   "waren":{"von":180000,"bis":260000,"schritt":5000},"bank":{"von":40000,"bis":90000,"schritt":5000},
   "kasse":{"von":2000,"bis":6000,"schritt":500},"darlehen":{"von":150000,"bis":250000,"schritt":10000},
   "verb_lul":{"von":80000,"bis":160000,"schritt":5000}},
  "abgeleitet":{"vermoegen":"maschinen+fuhrpark+waren+bank+kasse","schulden":"darlehen+verb_lul","eigenkapital":"vermoegen-schulden"},
  "anzeige":[{"block":"text","inhalt":"Sandra Koslowski legt Ihnen den Auszug aus dem Inventar des Studiobereichs vor."},
   {"block":"anlage","titel":"Anlage 1: Auszug aus dem Inventar zum 31.12.","zugeklappt":true,
    "inhalt":{"block":"tabelle","spalten":["Position","Wert in €"],"zeilen":[
      ["Maschinen und Druckanlagen","{maschinen}"],["Fuhrpark","{fuhrpark}"],["Warenbestand","{waren}"],
      ["Bankguthaben","{bank}"],["Kassenbestand","{kasse}"],["Bankdarlehen","{darlehen}"],
      ["Verbindlichkeiten aus Lieferungen und Leistungen","{verb_lul}"]]}}],
  "eingabe":[{"block":"zahl","label":"Gesamtvermögen","einheit":"€","loesung":"vermoegen","punkte":2},
   {"block":"zahl","label":"Gesamtschulden","einheit":"€","loesung":"schulden","punkte":1},
   {"block":"zahl","label":"Eigenkapital (Reinvermögen)","einheit":"€","loesung":"eigenkapital","punkte":2,"folgefehler_aus":["vermoegen","schulden"]}],
  "bewertung":{"art":"automatisch","punkte_gesamt":5},
  "erklaerung":"Eigenkapital = Gesamtvermögen − Gesamtschulden. Wer sich beim Vermögen verrechnet, bekommt den letzten Schritt trotzdem, wenn er mit dem eigenen Wert richtig weiterrechnet."},

 {"id":"buchfuehrung-k1-04","operator":"Begründen Sie","anforderungsbereich":3,"punkte":6,"dauer_min":8,
  "anzeige":[{"block":"text","inhalt":"Luca Petrelli hat im Store KANTE mehrere Barumsätze nicht erfasst, weil die Beträge unter zehn Euro lagen."}],
  "eingabe":[{"block":"textfeld","frage":"Begründen Sie, gegen welchen Grundsatz ordnungsgemäßer Buchführung dieses Vorgehen verstößt und welche Folge das für die MAKEL Studio GmbH haben kann.","zeilen":6}],
  "bewertung":{"art":"selbstbewertung",
   "musterloesung":"Das Vorgehen verstößt gegen den Grundsatz der Vollständigkeit: Alle Geschäftsvorfälle sind lückenlos zu erfassen, unabhängig von ihrer Höhe. Eine Betragsgrenze, unterhalb derer nicht gebucht werden müsste, gibt es nicht. Kommt es zu einer Kassennachschau oder Betriebsprüfung, gilt die Buchführung als nicht ordnungsgemäß. Das Finanzamt darf die Besteuerungsgrundlagen dann nach § 162 AO schätzen — regelmäßig zu Ungunsten des Betriebs. Zusätzlich drohen steuerliche Nachzahlungen und je nach Vorsatz weitere Konsequenzen.",
   "raster":[{"kriterium":"Grundsatz der Vollständigkeit genannt","punkte":2},
    {"kriterium":"Erklärt, dass es keine Betragsgrenze gibt","punkte":1},
    {"kriterium":"Buchführung gilt als nicht ordnungsgemäß","punkte":1},
    {"kriterium":"Schätzung durch das Finanzamt als Folge genannt","punkte":1},
    {"kriterium":"§ 162 AO als Grundlage genannt","punkte":1}]},
  "erklaerung":"Bei Operator „Begründen Sie“ reicht das Nennen des Grundsatzes nicht — verlangt sind Ursache und Folge."},

 {"id":"buchfuehrung-k1-05","operator":"Ordnen Sie zu","anforderungsbereich":2,"punkte":4,"dauer_min":4,
  "anzeige":[{"block":"text","inhalt":"Bei der Durchsicht des Journals fallen Sandra Koslowski vier Auffälligkeiten auf."},
   {"block":"anlage","titel":"Anlage 1: Auszug aus dem Journal","zugeklappt":true,
    "inhalt":{"block":"tabelle","spalten":["Nr.","Buchungstext"],"zeilen":[
     ["1","Diverses"],["2","Privater Restaurantbesuch als Bewirtung erfasst"],
     ["3","Abschreibungsmethode gegenüber dem Vorjahr gewechselt"],
     ["4","Wertsteigerung eines Grundstücks als Ertrag gebucht"]]}}],
  "eingabe":[{"block":"zuordnung","lead":"Ordnen Sie jeder Buchung den verletzten Grundsatz zu.","ziele":["Klarheit","Richtigkeit","Stetigkeit","Vorsicht"],"elemente":[
    {"text":"Nr. 1","loesung":"Klarheit"},{"text":"Nr. 2","loesung":"Richtigkeit"},
    {"text":"Nr. 3","loesung":"Stetigkeit"},{"text":"Nr. 4","loesung":"Vorsicht"}]}],
  "bewertung":{"art":"automatisch","punkte_je_treffer":1},
  "erklaerung":"Nr. 4 ist der häufigste Fehler: Gewinne werden erst bei Realisierung gebucht, Verluste sofort."}
 ]};

/* ---------- Zustand ---------- */
let modus = "ueben";          // "ueben" | "klausur"
let abgegeben = false;
let werte = {};               // je Baustein die gewürfelten Zahlen
let zuordnungen = {};         // je Baustein: Elementindex -> Ziel
let gewaehltesEl = null;

/* ---------- Werkzeug ---------- */
const eur = n => n.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2});

function auszeichnen(t){
  t = t.replace(/\{\{(begriff|par):([^|]+)\|([^}]+)\}\}/g,(m,art,id,wort)=>
    modus==="klausur" ? wort : `<span class="verweis" title="${art==="par"?"Gesetzestext":"Begriff"}: ${id}">${wort}</span>`);
  t = t.replace(/==(.+?)==/g,'<span class="gold">$1</span>');
  t = t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
  return t;
}

function wuerfeln(){
  werte = {};
  DATEI.bausteine.forEach(b=>{
    if(!b.variablen) return;
    const w = {};
    for(const [name,v] of Object.entries(b.variablen)){
      const stufen = Math.floor((v.bis-v.von)/v.schritt)+1;
      w[name] = v.von + Math.floor(Math.random()*stufen)*v.schritt;
    }
    for(const [name,formel] of Object.entries(b.abgeleitet||{})){
      w[name] = Function(...Object.keys(w),"return "+formel)(...Object.values(w));
    }
    werte[b.id] = w;
  });
}

function fuellen(text,w){
  return String(text).replace(/\{(\w+)\}/g,(m,k)=> w && k in w ? eur(w[k]) : m);
}

/* ---------- Aufbau ---------- */
function aufbauen(){
  document.getElementById("modushinweis").innerHTML = modus==="klausur"
    ? "Klausurmodus: keine Rückmeldung während der Bearbeitung, keine aufklappbaren Begriffe. Die Auswertung kommt erst nach der Abgabe."
    : "Freies Üben: Begriffe sind aufklappbar, nach der Abgabe erscheinen Erklärungen zu jeder Antwort.";

  const wurzel = document.getElementById("aufgaben");
  wurzel.innerHTML = "";
  zuordnungen = {}; gewaehltesEl = null;

  DATEI.bausteine.forEach((b,i)=>{
    const w = werte[b.id];
    const el = document.createElement("section");
    el.className = "aufgabe"; el.dataset.id = b.id;

    let html = `<div class="a-kopf">
        <div class="a-nr">Aufgabe ${i+1}</div>
        <div class="a-punkte">${b.punkte} Punkte · ca. ${b.dauer_min} Min · AFB ${b.anforderungsbereich}</div>
      </div>`;

    b.anzeige.forEach(a=>{
      if(a.block==="text") html += `<p>${auszeichnen(fuellen(a.inhalt,w))}</p>`;
      if(a.block==="anlage"){
        html += `<details class="anlage"${a.zugeklappt?"":" open"}>
          <summary>${a.titel}</summary>
          <div class="anlage-inhalt">${tabelle(a.inhalt,w)}</div></details>`;
      }
    });

    b.eingabe.forEach((e,ei)=>{
      if(e.block==="auswahl"){
        html += `<p class="frage"><span class="operator">${b.operator}:</span> ${auszeichnen(e.frage)}</p>`;
        e.optionen.forEach((o,oi)=>{
          html += `<label class="opt" data-opt="${oi}">
            <input type="radio" name="${b.id}" value="${oi}">
            <span>${auszeichnen(o.text)}</span></label>
            <div class="echo verborgen" data-echo="${oi}">${o.echo}</div>`;
        });
      }
      if(e.block==="zuordnung"){
        html += `<p class="frage"><span class="operator">${b.operator}:</span> ${e.lead}</p>
          <div class="zuordnung"><div class="stapel">`;
        e.elemente.forEach((x,xi)=>{
          html += `<div class="el" data-el="${xi}">${auszeichnen(x.text)}</div>`;
        });
        html += `</div><div class="ziele">`;
        e.ziele.forEach(z=>{
          html += `<div class="ziel" data-ziel="${z}"><div class="ziel-name">${z}</div><div class="drin"></div></div>`;
        });
        html += `</div></div>`;
      }
      if(e.block==="zahl"){
        html += `<div class="feldzeile">
          <label for="${b.id}-${ei}">${e.label}</label>
          <input type="number" step="0.01" id="${b.id}-${ei}" data-feld="${ei}">
          <span class="feld-punkte">${e.einheit} · ${e.punkte} P.</span>
          <span class="pruefung" data-pruef="${ei}"></span></div>`;
      }
      if(e.block==="textfeld"){
        html += `<p class="frage"><span class="operator">${b.operator}:</span> ${auszeichnen(e.frage)}</p>
          <textarea rows="${e.zeilen}" data-feld="${ei}" placeholder="Ihre Antwort"></textarea>`;
      }
    });

    html += `<div class="loesungsblock verborgen" data-loesung></div>`;
    el.innerHTML = html;
    wurzel.appendChild(el);
  });

  verdrahten();
}

function tabelle(t,w){
  let h = "<table><thead><tr>";
  t.spalten.forEach((s,i)=> h += `<th${i>0?' style="text-align:right"':""}>${s}</th>`);
  h += "</tr></thead><tbody>";
  t.zeilen.forEach(z=>{
    h += "<tr>";
    z.forEach((c,i)=> h += i>0 ? `<td class="zahl">${fuellen(c,w)}</td>` : `<td>${fuellen(c,w)}</td>`);
    h += "</tr>";
  });
  return h + "</tbody></table>";
}

/* ---------- Zuordnung per Antippen ---------- */
function verdrahten(){
  document.querySelectorAll(".stapel .el").forEach(el=>{
    el.onclick = ()=>{
      if(abgegeben || el.classList.contains("gesetzt")) return;
      document.querySelectorAll(".stapel .el").forEach(x=>x.classList.remove("gewaehlt"));
      el.classList.add("gewaehlt");
      gewaehltesEl = el;
    };
  });
  document.querySelectorAll(".ziel").forEach(ziel=>{
    ziel.onclick = ()=>{
      if(abgegeben || !gewaehltesEl) return;
      const karte = gewaehltesEl.closest(".aufgabe");
      if(!ziel.closest(".aufgabe").isSameNode(karte)) return;
      const id = karte.dataset.id, xi = gewaehltesEl.dataset.el;
      zuordnungen[id] = zuordnungen[id] || {};
      zuordnungen[id][xi] = ziel.dataset.ziel;
      gewaehltesEl.classList.remove("gewaehlt");
      gewaehltesEl.classList.add("gesetzt");
      gewaehltesEl = null;
      zieleZeichnen(karte);
    };
  });
}

function zieleZeichnen(karte){
  const id = karte.dataset.id;
  const b = DATEI.bausteine.find(x=>x.id===id);
  const e = b.eingabe.find(x=>x.block==="zuordnung");
  karte.querySelectorAll(".ziel").forEach(ziel=>{
    const drin = ziel.querySelector(".drin"); drin.innerHTML = "";
    Object.entries(zuordnungen[id]||{}).forEach(([xi,z])=>{
      if(z===ziel.dataset.ziel){
        const s = document.createElement("span");
        s.innerHTML = auszeichnen(e.elemente[xi].text);
        if(abgegeben) s.className = e.elemente[xi].loesung===z ? "ok" : "nok";
        drin.appendChild(s);
      }
    });
  });
}

/* ---------- Auswertung ---------- */
function auswerten(){
  abgegeben = true;
  let erreicht = 0, moeglich = 0, offenePunkte = 0;

  DATEI.bausteine.forEach(b=>{
    const karte = document.querySelector(`[data-id="${b.id}"]`);
    const kasten = karte.querySelector("[data-loesung]");
    const w = werte[b.id];
    moeglich += b.punkte;
    let p = 0;

    b.eingabe.forEach((e,ei)=>{
      if(e.block==="auswahl"){
        const gewaehlt = karte.querySelector(`input[name="${b.id}"]:checked`);
        e.optionen.forEach((o,oi)=>{
          const lab = karte.querySelector(`[data-opt="${oi}"]`);
          if(o.richtig) lab.classList.add("richtig");
          if(gewaehlt && +gewaehlt.value===oi && !o.richtig) lab.classList.add("falsch");
          if(modus==="ueben" && gewaehlt && +gewaehlt.value===oi)
            karte.querySelector(`[data-echo="${oi}"]`).classList.remove("verborgen");
        });
        if(gewaehlt && e.optionen[+gewaehlt.value].richtig) p += b.punkte;
      }

      if(e.block==="zuordnung"){
        const z = zuordnungen[b.id]||{};
        e.elemente.forEach((x,xi)=>{ if(z[xi]===x.loesung) p += b.bewertung.punkte_je_treffer; });
        zieleZeichnen(karte);
      }

      if(e.block==="zahl"){
        const feld = karte.querySelector(`[data-feld="${ei}"]`);
        const eingabe = parseFloat(feld.value);
        const soll = w[e.loesung];
        const marke = karte.querySelector(`[data-pruef="${ei}"]`);
        let richtig = Math.abs(eingabe - soll) < 0.01;

        // Folgefehler: mit den eigenen Zwischenwerten nachgerechnet gilt auch
        if(!richtig && e.folgefehler_aus){
          const eigene = e.folgefehler_aus.map(name=>{
            const idx = b.eingabe.findIndex(x=>x.loesung===name);
            return parseFloat(karte.querySelector(`[data-feld="${idx}"]`).value);
          });
          if(eigene.every(v=>!isNaN(v)) && Math.abs(eingabe-(eigene[0]-eigene[1]))<0.01){
            richtig = true;
            marke.innerHTML = '<span class="ok">Folgefehler anerkannt</span>';
          }
        }
        if(richtig){ p += e.punkte; if(!marke.innerHTML) marke.innerHTML = '<span class="ok">richtig</span>'; }
        else marke.innerHTML = `<span class="nok">${eur(soll)} €</span>`;
      }

      if(e.block==="textfeld"){
        const bw = b.bewertung;
        let h = `<h4>Musterlösung</h4><p>${bw.musterloesung}</p>
          <h4>Punkteraster — haken Sie ab, was in Ihrer Antwort steht</h4><div class="raster">`;
        bw.raster.forEach((r,ri)=>{
          h += `<label><input type="checkbox" data-raster="${b.id}" data-p="${r.punkte}">
            <span>${r.kriterium}</span><span class="p">${r.punkte} P.</span></label>`;
        });
        h += `</div>`;
        kasten.insertAdjacentHTML("beforeend",h);
        offenePunkte += b.punkte;
        kasten.querySelectorAll(`[data-raster="${b.id}"]`).forEach(cb=>{
          cb.onchange = summeZeichnen;
        });
      }
    });

    karte.dataset.punkte = p;
    if(b.bewertung.art!=="selbstbewertung"){
      kasten.insertAdjacentHTML("afterbegin",
        `<h4>Bewertung</h4><p>${p} von ${b.punkte} Punkten</p>`);
    }
    if(modus==="ueben" && b.erklaerung)
      kasten.insertAdjacentHTML("beforeend",`<div class="erklaerung">${b.erklaerung}</div>`);
    kasten.classList.remove("verborgen");
    erreicht += p;
  });

  document.getElementById("btn-abgeben").disabled = true;
  summeZeichnen();
}

function summeZeichnen(){
  let erreicht = 0, moeglich = 0;
  DATEI.bausteine.forEach(b=>{
    moeglich += b.punkte;
    const karte = document.querySelector(`[data-id="${b.id}"]`);
    if(b.bewertung.art==="selbstbewertung"){
      karte.querySelectorAll(`[data-raster="${b.id}"]:checked`).forEach(cb=> erreicht += +cb.dataset.p);
    } else erreicht += +karte.dataset.punkte;
  });
  const prozent = moeglich ? Math.round(erreicht/moeglich*1000)/10 : 0;
  document.getElementById("ergebnis").innerHTML =
    `<b>${erreicht}</b> von ${moeglich} Punkten · ${prozent} % · Note ${note(prozent)}`;
}

function note(p){
  if(p>=92) return "1"; if(p>=81) return "2"; if(p>=67) return "3";
  if(p>=50) return "4"; if(p>=30) return "5"; return "6";
}

/* ---------- Bedienung ---------- */
function zuruecksetzen(){
  abgegeben = false;
  document.getElementById("btn-abgeben").disabled = false;
  document.getElementById("ergebnis").textContent = "Noch nicht abgegeben";
  aufbauen();
}
document.getElementById("btn-ueben").onclick = ()=>{
  modus="ueben";
  document.getElementById("btn-ueben").classList.add("an");
  document.getElementById("btn-klausur").classList.remove("an");
  zuruecksetzen();
};
document.getElementById("btn-klausur").onclick = ()=>{
  modus="klausur";
  document.getElementById("btn-klausur").classList.add("an");
  document.getElementById("btn-ueben").classList.remove("an");
  zuruecksetzen();
};
document.getElementById("btn-wuerfeln").onclick = ()=>{ wuerfeln(); zuruecksetzen(); };
document.getElementById("btn-abgeben").onclick = auswerten;

wuerfeln();
aufbauen();
</script>
